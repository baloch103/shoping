<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraMart - AliExpress Style Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen font-sans">

  <!-- NAVBAR -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
      
      <a href="#" onclick="location.reload()" class="flex items-center gap-2 font-bold text-xl tracking-wide text-indigo-400">
        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
        <span>AuraMart <span class="text-xs bg-red-600 text-white font-semibold px-2 py-0.5 rounded-full">Deals</span></span>
      </a>

      <div class="flex items-center space-x-4">
        <a href="https://wa.me/923363152236" target="_blank" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded-lg text-xs font-semibold text-white">
          <i data-lucide="message-square" class="w-4 h-4"></i> WhatsApp Help
        </a>
      </div>

    </div>
  </header>

  <!-- MAIN HOME GRID PAGE -->
  <main class="flex-grow max-w-7xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
        <i data-lucide="sparkles" class="text-amber-500"></i> Recommended For You
      </h2>
      <button onclick="fetchLiveProducts()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold px-3 py-2 rounded-lg flex items-center gap-1">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
      </button>
    </div>

    <!-- ALIEXPRESS STYLE PRODUCTS GRID (Compact View) -->
    <div id="liveProductsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <div class="col-span-full text-center py-12 text-gray-500 font-semibold">Loading deals...</div>
    </div>
  </main>

  <!-- PRODUCT DETAIL POPUP MODAL (FULL VIEW ON CLICK) -->
  <div id="productModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-white w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl relative max-h-[90vh] flex flex-col">
      
      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute top-3 right-3 z-10 bg-slate-900/80 hover:bg-slate-900 text-white p-2 rounded-full transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <!-- Modal Content Body -->
      <div id="modalContent" class="p-6 overflow-y-auto">
        <!-- Dynamic Gallery Content Injected Here -->
      </div>
    </div>
  </div>

  <footer class="bg-slate-900 text-gray-400 py-6 border-t border-slate-800 text-center text-xs space-y-1">
    <p>© 2026 AuraMart Store | Managed by Ali Akbar Shar (Daharki, Sindh)</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://hhywazbkgalioqqpuhyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeXdhemJrZ2FsaW9xcXB1aHl6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODE0OTI0MCwiZXhwIjoyMTAzNzI1MjQwfQ.yHHUaGrOn8gKy_1kgujNXupqziJZmQalVIS0F9AU0sY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let globalProducts = [];

    async function fetchLiveProducts() {
      const grid = document.getElementById('liveProductsGrid');
      const { data: products, error } = await _supabase.from('products').select('*').order('id', { ascending: false });

      if (error || !products || products.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-gray-500 py-12">No products published yet.</div>`;
        return;
      }

      globalProducts = products;

      // Render Compact AliExpress Grid Cards
      grid.innerHTML = products.map((item, index) => {
        const defaultImg = item.image_url || 'https://via.placeholder.com/400';
        const img1 = item.image_1 || defaultImg;

        return `
        <div onclick="openModal(${index})" class="bg-white rounded-xl overflow-hidden border border-gray-200 shadow-sm hover:shadow-md transition-all cursor-pointer flex flex-col justify-between group">
          
          <div>
            <!-- Image Frame -->
            <div class="relative aspect-square bg-gray-100 overflow-hidden">
              <img src="${img1}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
              <div class="absolute bottom-2 right-2 bg-white/90 p-1.5 rounded-full shadow border border-gray-100">
                <i data-lucide="shopping-cart" class="w-3.5 h-3.5 text-slate-800"></i>
              </div>
            </div>

            <!-- Title & Price Info -->
            <div class="p-3 space-y-1.5">
              <h3 class="text-xs font-semibold text-gray-800 line-clamp-2 leading-snug group-hover:text-indigo-600">${item.title}</h3>
              
              <div class="flex items-baseline gap-1">
                <span class="text-xs font-bold text-red-600">Rs.</span>
                <span class="text-base font-extrabold text-red-600">${item.price}</span>
              </div>

              <div class="flex items-center gap-1 text-[10px] text-gray-500">
                <span class="bg-red-50 text-red-600 font-bold px-1.5 py-0.5 rounded">Choice</span>
                <span>Free shipping</span>
              </div>
            </div>
          </div>

        </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // OPEN FULL GALLERY MODAL ON CLICK
    function openModal(index) {
      const item = globalProducts[index];
      const defaultImg = item.image_url || 'https://via.placeholder.com/400';
      const img1 = item.image_1 || defaultImg;
      const img2 = item.image_2 || img1;
      const img3 = item.image_3 || img1;
      const img4 = item.image_4 || img1;
      const affUrl = item.affiliate_url || '#';

      const modalContent = document.getElementById('modalContent');
      
      modalContent.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
          
          <!-- LEFT GALLERY LAYOUT (MATCHING VERTICAL DESIGN) -->
          <div class="md:col-span-7 flex gap-3">
            
            <!-- Left Thumbnails -->
            <div class="flex flex-col gap-2 w-16 shrink-0">
              <div onclick="swapModalImage('${img1}')" class="h-14 w-full rounded-lg border-2 border-slate-900 overflow-hidden cursor-pointer">
                <img src="${img1}" class="w-full h-full object-cover">
              </div>
              <div onclick="swapModalImage('${img2}')" class="h-14 w-full rounded-lg border border-gray-200 overflow-hidden cursor-pointer hover:border-indigo-600">
                <img src="${img2}" class="w-full h-full object-cover">
              </div>
              <div onclick="swapModalImage('${img3}')" class="h-14 w-full rounded-lg border border-gray-200 overflow-hidden cursor-pointer hover:border-indigo-600">
                <img src="${img3}" class="w-full h-full object-cover">
              </div>
              <div onclick="swapModalImage('${img4}')" class="h-14 w-full rounded-lg border border-gray-200 overflow-hidden cursor-pointer hover:border-indigo-600">
                <img src="${img4}" class="w-full h-full object-cover">
              </div>
            </div>

            <!-- Main Large Preview -->
            <div class="flex-grow bg-slate-50 rounded-xl border border-gray-200 flex items-center justify-center p-2 min-h-[300px]">
              <img id="modalMainImg" src="${img1}" class="max-h-96 object-contain">
            </div>
          </div>

          <!-- RIGHT PRODUCT DETAILS -->
          <div class="md:col-span-5 flex flex-col justify-between space-y-4">
            <div>
              <span class="bg-slate-100 text-slate-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">${item.category || 'General'}</span>
              <h2 class="text-xl font-bold text-gray-900 mt-2 leading-snug">${item.title}</h2>
              <p class="text-xs text-gray-600 mt-2 leading-relaxed">${item.description || 'No detailed description provided.'}</p>
            </div>

            <div class="space-y-4 pt-4 border-t border-gray-100">
              <div>
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider block">Price</span>
                <span class="text-2xl font-extrabold text-red-600">Rs. ${item.price}</span>
              </div>

              <div class="flex flex-col gap-2">
                <a href="${affUrl}" target="_blank" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-sm">
                  <i data-lucide="external-link" class="w-4 h-4"></i> Buy on AliExpress
                </a>
                <a href="https://wa.me/923363152236?text=I%20want%20to%20order:%20${encodeURIComponent(item.title)}" target="_blank" class="w-full bg-slate-900 hover:bg-slate-950 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-sm">
                  <i data-lucide="message-square" class="w-4 h-4"></i> Order via WhatsApp
                </a>
              </div>
            </div>
          </div>

        </div>
      `;

      document.getElementById('productModal').classList.remove('hidden');
      lucide.createIcons();
    }

    function swapModalImage(newUrl) {
      document.getElementById('modalMainImg').src = newUrl;
    }

    function closeModal() {
      document.getElementById('productModal').classList.add('hidden');
    }

    fetchLiveProducts();
  </script>
</body>
</html>
