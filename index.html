<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraMart - AliExpress Affiliate & Online Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen font-sans">

  <!-- NAVBAR -->
  <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
      
      <a href="#" onclick="location.reload()" class="flex items-center gap-2 font-bold text-xl tracking-wide text-indigo-400">
        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
        <span>AuraMart <span class="text-xs bg-red-600 text-white font-semibold px-2 py-0.5 rounded-full">Affiliate</span></span>
      </a>

      <div class="flex items-center space-x-4">
        <a href="https://wa.me/923363152236" target="_blank" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded-lg text-xs font-semibold text-white">
          <i data-lucide="message-square" class="w-4 h-4"></i> WhatsApp Help
        </a>
      </div>

    </div>
  </header>

  <!-- HERO BANNER -->
  <main class="flex-grow">
    <div class="bg-gradient-to-r from-slate-950 via-indigo-950 to-slate-900 text-white py-12 px-4 border-b border-indigo-900/40">
      <div class="max-w-7xl mx-auto text-center space-y-3">
        <span class="bg-indigo-500/20 text-indigo-300 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-widest border border-indigo-500/30">Official Deals Hub</span>
        <h1 class="text-3xl md:text-5xl font-extrabold">Top Quality Products & Hot Deals</h1>
        <p class="text-gray-300 text-sm max-w-xl mx-auto">Shop directly via WhatsApp or buy authentic items directly from AliExpress with best affiliate deals.</p>
      </div>
    </div>

    <!-- PRODUCTS GRID SECTION -->
    <div class="max-w-7xl mx-auto px-4 py-10">
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
          <i data-lucide="sparkles" class="text-amber-500"></i> Trending Deals
        </h2>
        <button onclick="fetchLiveProducts()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold px-3 py-2 rounded-lg flex items-center gap-1">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Items
        </button>
      </div>

      <div id="liveProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-full text-center py-12 text-gray-500 font-semibold">Loading live products...</div>
      </div>
    </div>
  </main>

  <footer class="bg-slate-900 text-gray-400 py-6 border-t border-slate-800 text-center text-xs space-y-1">
    <p>© 2026 AuraMart Store | Managed by Ali Akbar Shar (Daharki, Sindh)</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://hhywazbkgalioqqpuhyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeXdhemJrZ2FsaW9xcXB1aHl6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODE0OTI0MCwiZXhwIjoyMTAzNzI1MjQwfQ.yHHUaGrOn8gKy_1kgujNXupqziJZmQalVIS0F9AU0sY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchLiveProducts() {
      const grid = document.getElementById('liveProductsGrid');
      const { data: products, error } = await _supabase.from('products').select('*').order('id', { ascending: false });

      if (error || !products || products.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center text-gray-500 py-12">No products published yet.</div>`;
        return;
      }

      grid.innerHTML = products.map(item => {
        const defaultImg = item.image_url || 'https://via.placeholder.com/400';
        const img1 = item.image_1 || defaultImg;
        const img2 = item.image_2 || img1;
        const img3 = item.image_3 || img1;
        const img4 = item.image_4 || img1;
        const affUrl = item.affiliate_url || '#';

        return `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-lg transition-shadow">
          <div>
            <!-- Main Display Image -->
            <div class="relative bg-gray-100 h-64 overflow-hidden">
              <img id="main-img-${item.id}" src="${img1}" class="w-full h-full object-cover transition-all duration-300">
              <span class="absolute top-3 left-3 bg-slate-900/80 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">${item.category || 'General'}</span>
            </div>

            <!-- 4 Thumbnail Selection Images -->
            <div class="grid grid-cols-4 gap-1 p-2 bg-slate-50 border-b border-gray-100">
              <img src="${img1}" onclick="swapImage('${item.id}', '${img1}')" class="h-14 w-full object-cover rounded cursor-pointer border hover:border-indigo-600">
              <img src="${img2}" onclick="swapImage('${item.id}', '${img2}')" class="h-14 w-full object-cover rounded cursor-pointer border hover:border-indigo-600">
              <img src="${img3}" onclick="swapImage('${item.id}', '${img3}')" class="h-14 w-full object-cover rounded cursor-pointer border hover:border-indigo-600">
              <img src="${img4}" onclick="swapImage('${item.id}', '${img4}')" class="h-14 w-full object-cover rounded cursor-pointer border hover:border-indigo-600">
            </div>

            <!-- Product Body Details -->
            <div class="p-5 space-y-3">
              <h3 class="font-bold text-gray-900 text-lg leading-snug">${item.title}</h3>
              <p class="text-xs text-gray-600 leading-relaxed">${item.description || 'No detailed description provided.'}</p>
            </div>
          </div>

          <!-- Price & Dual Buy Action Buttons -->
          <div class="p-5 pt-0 space-y-3">
            <div class="flex items-baseline justify-between border-t border-gray-100 pt-3">
              <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Price</span>
              <span class="text-xl font-extrabold text-indigo-600">Rs. ${item.price}</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <a href="${affUrl}" target="_blank" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1 shadow-sm transition-colors">
                <i data-lucide="external-link" class="w-4 h-4"></i> Buy on AliExpress
              </a>
              <a href="https://wa.me/923363152236?text=I%20want%20to%20order:%20${encodeURIComponent(item.title)}" target="_blank" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1 shadow-sm transition-colors">
                <i data-lucide="message-square" class="w-4 h-4"></i> Order via WhatsApp
              </a>
            </div>
          </div>

        </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function swapImage(productId, newUrl) {
      document.getElementById(`main-img-${productId}`).src = newUrl;
    }

    fetchLiveProducts();
  </script>
</body>
</html>
