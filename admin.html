<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraMart - Admin & Affiliate Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2 font-bold text-lg text-indigo-400">
      <i data-lucide="layout-dashboard"></i>
      <span>AuraMart Admin Panel (Ali Akbar Shar)</span>
    </div>
    <a href="index.html" target="_blank" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-bold flex items-center gap-1">
      <i data-lucide="eye" class="w-4 h-4"></i> View Live Store
    </a>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-8">
    
    <!-- ADD PRODUCT FORM -->
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-6">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <i data-lucide="plus-circle" class="text-emerald-400"></i> Add New Product & AliExpress Link
      </h2>

      <form id="addProductForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Product Title *</label>
            <input type="text" id="prodTitle" required placeholder="e.g. Wireless Bluetooth Earbuds" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Price (PKR) *</label>
            <input type="number" id="prodPrice" required placeholder="2500" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Category *</label>
            <input type="text" id="prodCategory" required placeholder="Electronics / Fashion" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:border-indigo-500 outline-none">
          </div>
        </div>

        <!-- 4 IMAGES URL INPUTS -->
        <div class="space-y-2">
          <label class="block text-xs font-bold uppercase tracking-wider text-amber-400">Product Images (1 Main Display Image + 3 Thumbnails)</label>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <input type="url" id="prodImg1" required placeholder="Main Image 1 URL (Required)" class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs focus:border-indigo-500 outline-none">
            <input type="url" id="prodImg2" placeholder="Thumbnail Image 2 URL (Optional)" class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs focus:border-indigo-500 outline-none">
            <input type="url" id="prodImg3" placeholder="Thumbnail Image 3 URL (Optional)" class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs focus:border-indigo-500 outline-none">
            <input type="url" id="prodImg4" placeholder="Thumbnail Image 4 URL (Optional)" class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs focus:border-indigo-500 outline-none">
          </div>
        </div>

        <!-- ALIEXPRESS AFFILIATE URL -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-red-400 mb-1">AliExpress Affiliate Link *</label>
          <input type="url" id="prodAffiliateUrl" required placeholder="https://s.click.aliexpress.com/e/..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs focus:border-indigo-500 outline-none">
        </div>

        <!-- PRODUCT DESCRIPTION -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Detailed Description *</label>
          <textarea id="prodDescription" rows="3" required placeholder="Write detailed specs, features, and info..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs focus:border-indigo-500 outline-none"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 font-bold py-3 rounded-xl text-sm transition-colors flex justify-center items-center gap-2">
          <i data-lucide="plus"></i> Publish Product to AuraMart
        </button>
      </form>
    </div>

    <!-- PUBLISHED PRODUCTS LIST -->
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
      <h2 class="text-lg font-bold text-white">Live Inventory</h2>
      <div id="adminProductList" class="space-y-3">
        <p class="text-xs text-slate-500">Loading published items...</p>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://hhywazbkgalioqqpuhyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeXdhemJrZ2FsaW9xcXB1aHl6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODE0OTI0MCwiZXhwIjoyMTAzNzI1MjQwfQ.yHHUaGrOn8gKy_1kgujNXupqziJZmQalVIS0F9AU0sY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Publishing Product...";
      btn.disabled = true;

      const mainImage = document.getElementById('prodImg1').value;

      const payload = {
        title: document.getElementById('prodTitle').value,
        price: parseFloat(document.getElementById('prodPrice').value),
        category: document.getElementById('prodCategory').value,
        image_url: mainImage, // Fix for not-null constraint on image_url
        image_1: mainImage,
        image_2: document.getElementById('prodImg2').value || mainImage,
        image_3: document.getElementById('prodImg3').value || mainImage,
        image_4: document.getElementById('prodImg4').value || mainImage,
        affiliate_url: document.getElementById('prodAffiliateUrl').value,
        description: document.getElementById('prodDescription').value
      };

      const { error } = await _supabase.from('products').insert([payload]);

      if(error) {
        alert("Error publishing product: " + error.message);
      } else {
        alert("🎉 Product published successfully with AliExpress Affiliate link!");
        document.getElementById('addProductForm').reset();
        fetchAdminProducts();
      }

      btn.innerText = "Publish Product to AuraMart";
      btn.disabled = false;
    });

    async function fetchAdminProducts() {
      const container = document.getElementById('adminProductList');
      const { data: products, error } = await _supabase.from('products').select('*').order('id', { ascending: false });

      if (error || !products || products.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500">No items in store database.</p>`;
        return;
      }

      container.innerHTML = products.map(item => `
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
          <div class="flex items-center gap-3">
            <img src="${item.image_1 || item.image_url}" class="w-12 h-12 rounded object-cover">
            <div>
              <p class="font-bold text-sm text-white">${item.title}</p>
              <p class="text-xs text-slate-400">Rs. ${item.price} • ${item.category}</p>
            </div>
          </div>
          <button onclick="deleteProduct(${item.id})" class="bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1 rounded text-xs hover:bg-red-500/20 font-bold">
            Delete
          </button>
        </div>
      `).join('');
    }

    async function deleteProduct(id) {
      if(confirm("Are you sure you want to delete this product?")) {
        await _supabase.from('products').delete().eq('id', id);
        fetchAdminProducts();
      }
    }

    fetchAdminProducts();
    lucide.createIcons();
  </script>
</body>
</html>
