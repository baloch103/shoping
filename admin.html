<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraMart - Product Management Admin Panel</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <!-- Top Header -->
  <header class="bg-slate-900 text-white py-4 px-6 shadow-md flex justify-between items-center">
    <div class="flex items-center gap-2 font-bold text-xl text-indigo-400">
      <i data-lucide="shield-check" class="w-6 h-6"></i>
      <span>AuraMart Admin Panel</span>
    </div>
    <a href="index.html" class="text-sm bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg transition-all flex items-center gap-2">
      <i data-lucide="external-link" class="w-4 h-4"></i> View Main Shop
    </a>
  </header>

  <div class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">

    <!-- Add Product Form Section -->
    <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-200 h-fit">
      <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i data-lucide="plus-circle" class="text-indigo-600"></i> Add New Product
      </h2>

      <form id="addProductForm" class="space-y-4">
        
        <!-- Product Name -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Product Title *</label>
          <input type="text" id="pTitle" placeholder="e.g. Wireless Smart Headset" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <!-- Product Price -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Price ($) *</label>
          <input type="number" step="0.01" id="pPrice" placeholder="e.g. 199.99" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <!-- Product Category Select -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Category *</label>
          <select id="pCategory" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="">Select Category</option>
            <option value="Electronics">Electronics (اليڪٽرونڪس)</option>
            <option value="Gadgets">Gadgets (گيجٽس)</option>
            <option value="Accessories">Accessories (ايڪسيسريز)</option>
            <option value="Apparel">Apparel (لباس / ڪپڙا)</option>
            <option value="Footwear">Footwear (جوتا / جوتا)</option>
          </select>
        </div>

        <!-- Image URL -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Product Image URL *</label>
          <input type="url" id="pImageUrl" placeholder="https://images.unsplash.com/..." required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
        </div>

        <!-- Product Description -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Product Description</label>
          <textarea id="pDescription" rows="4" placeholder="Enter feature highlights and product details..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="saveBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow transition-all flex justify-center items-center gap-2">
          <i data-lucide="upload-cloud"></i> Publish Product
        </button>

      </form>
    </div>

    <!-- Product List View Table -->
    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="package" class="text-indigo-600"></i> All Products Database
        </h2>
        <button onclick="fetchProducts()" class="text-sm bg-gray-100 hover:bg-gray-200 p-2 rounded-lg">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-xs font-bold uppercase tracking-wider">
              <th class="p-3">Image</th>
              <th class="p-3">Title</th>
              <th class="p-3">Category</th>
              <th class="p-3">Price</th>
              <th class="p-3 text-right">Action</th>
            </tr>
          </thead>
          <tbody id="productsTableBody" class="divide-y divide-gray-100 text-sm">
            <tr>
              <td colspan="5" class="p-4 text-center text-gray-500">Loading products...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Supabase Setup Config
    const SUPABASE_URL = 'https://hhywazbkgalioqqpuhyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeXdhemJrZ2FsaW9xcXB1aHl6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODE0OTI0MCwiZXhwIjoyMTAzNzI1MjQwfQ.yHHUaGrOn8gKy_1kgujNXupqziJZmQalVIS0F9AU0sY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Save Product to Supabase
    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.innerText = "Saving Product...";
      saveBtn.disabled = true;

      const productData = {
        title: document.getElementById('pTitle').value,
        price: parseFloat(document.getElementById('pPrice').value),
        category: document.getElementById('pCategory').value,
        image_url: document.getElementById('pImageUrl').value,
        description: document.getElementById('pDescription').value,
      };

      const { data, error } = await _supabase.from('products').insert([productData]);

      if (error) {
        alert("Error saving product: " + error.message);
      } else {
        alert("Product Published Successfully!");
        document.getElementById('addProductForm').reset();
        fetchProducts();
      }

      saveBtn.innerText = "Publish Product";
      saveBtn.disabled = false;
    });

    // Fetch Products List
    async function fetchProducts() {
      const tbody = document.getElementById('productsTableBody');
      const { data: products, error } = await _supabase
        .from('products')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Error loading products</td></tr>`;
        return;
      }

      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No products uploaded yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = products.map(item => `
        <tr class="hover:bg-gray-50">
          <td class="p-3">
            <img src="${item.image_url}" alt="Product" class="w-12 h-12 object-cover rounded-lg border">
          </td>
          <td class="p-3 font-semibold text-gray-800">${item.title}</td>
          <td class="p-3">
            <span class="text-xs font-bold px-2 py-1 rounded bg-indigo-50 text-indigo-600">${item.category}</span>
          </td>
          <td class="p-3 font-bold text-gray-900">$${item.price}</td>
          <td class="p-3 text-right">
            <button onclick="deleteProduct(${item.id})" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition-colors">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        </tr>
      `).join('');

      lucide.createIcons();
    }

    // Delete Product
    async function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this product?")) {
        const { error } = await _supabase.from('products').delete().eq('id', id);
        if (error) alert("Error deleting: " + error.message);
        else fetchProducts();
      }
    }

    // Initialize Page Data & Icons
    fetchProducts();
    lucide.createIcons();
  </script>

</body>
</html>
